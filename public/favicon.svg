<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <style>
      .navy { fill: #29166F; }
      .red { fill: #DA251C; }
      .ae-text { font-family: 'Georgia', 'Times New Roman', serif; font-style: italic; font-weight: bold; font-size: 190px; fill: #29166F; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background circle (White) -->
  <circle cx="250" cy="250" r="240" fill="#FFFFFF"/>

  <!-- Left / Bottom-Right Red Gear Arc & Teeth -->
  <path class="red" d="
    M 250,250
    L 250,10
    A 240,240 0 0,0 10,250
    L 250,250 Z" />
  <path class="red" d="
    M 250,250
    L 250,490
    A 240,240 0 0,0 490,250
    L 250,250 Z" />

  <!-- Top-Right / Bottom-Left Navy Indigo Gear Arc & Teeth -->
  <path class="navy" d="
    M 250,250
    L 490,250
    A 240,240 0 0,0 250,10
    L 250,250 Z" />
  <path class="navy" d="
    M 250,250
    L 10,250
    A 240,240 0 0,0 250,490
    L 250,250 Z" />

  <!-- Outer Gear Teeth Rectangles -->
  <!-- Red Quadrant Teeth (Top Left: 180 to 270 deg) -->
  <rect class="red" x="235" y="-10" width="30" height="40" transform="rotate(205 250 250)" rx="4"/>
  <rect class="red" x="235" y="-10" width="30" height="40" transform="rotate(225 250 250)" rx="4"/>
  <rect class="red" x="235" y="-10" width="30" height="40" transform="rotate(245 250 250)" rx="4"/>

  <!-- Red Quadrant Teeth (Bottom Right: 0 to 90 deg / 90 to 180 deg) -->
  <rect class="red" x="235" y="-10" width="30" height="40" transform="rotate(25 250 250)" rx="4"/>
  <rect class="red" x="235" y="-10" width="30" height="40" transform="rotate(45 250 250)" rx="4"/>
  <rect class="red" x="235" y="-10" width="30" height="40" transform="rotate(65 250 250)" rx="4"/>

  <!-- Navy Quadrant Teeth (Top Right: 270 to 360 / 0 deg) -->
  <rect class="navy" x="235" y="-10" width="30" height="40" transform="rotate(295 250 250)" rx="4"/>
  <rect class="navy" x="235" y="-10" width="30" height="40" transform="rotate(315 250 250)" rx="4"/>
  <rect class="navy" x="235" y="-10" width="30" height="40" transform="rotate(335 250 250)" rx="4"/>

  <!-- Navy Quadrant Teeth (Bottom Left: 110 to 180 deg) -->
  <rect class="navy" x="235" y="-10" width="30" height="40" transform="rotate(115 250 250)" rx="4"/>
  <rect class="navy" x="235" y="-10" width="30" height="40" transform="rotate(135 250 250)" rx="4"/>
  <rect class="navy" x="235" y="-10" width="30" height="40" transform="rotate(155 250 250)" rx="4"/>

  <!-- Inner White Circle for Monogram -->
  <circle cx="250" cy="250" r="160" fill="#FFFFFF" />

  <!-- AE Monogram Text -->
  <text x="250" y="315" class="ae-text">Æ</text>
</svg>
